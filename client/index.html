<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Meta Ads · Command Center — Concepto</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.383.0/umd/lucide.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#0E0C07;overflow-x:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;color:#F6F1E7;min-height:100vh}
#root{max-width:100%;margin:0 auto;padding:16px 12px 60px}
.spin{animation:sp .9s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
input::placeholder{color:#7C7360}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#1F1810}::-webkit-scrollbar-thumb{background:#3A2F1E;border-radius:3px}
.tip{position:relative;cursor:default}
.tip .tipbox{display:none;position:absolute;bottom:calc(100% + 6px);right:0;background:#261E14;border:1px solid #F2740B66;border-radius:8px;padding:8px 12px;white-space:nowrap;z-index:20;box-shadow:0 4px 16px rgba(0,0,0,0.5);pointer-events:none}
.tip .tipbox::after{content:'';position:absolute;bottom:-5px;right:14px;width:8px;height:8px;background:#261E14;border-right:1px solid #F2740B66;border-bottom:1px solid #F2740B66;transform:rotate(45deg)}
.tip:hover .tipbox{display:block}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* ================================================================ */
/* CONFIG                                                            */
/* ================================================================ */
const CONFIG = {
  serverUrl: localStorage.getItem("cc_server") || "",
  secret: localStorage.getItem("cc_secret") || "",
};

/* Paleta */
const D = {
  bg:"#151109",surface:"#1F1810",card:"#261E14",
  line:"#3A2F1E",lineSoft:"#2C2317",
  text:"#F6F1E7",dim:"#B7AC97",faint:"#7C7360",
  orange:"#F2740B",orangeSoft:"#3A2410",
  green:"#3FBE79",greenSoft:"#16321F",
  amber:"#E6A93A",amberSoft:"#37280F",
  red:"#E8613E",redSoft:"#3A190F",
};

/* Formato */
const toNum = v => Number.isFinite(+v) ? +v : 0;
const sym = c => c==="USD"?"US$ ":c==="DKK"?"DKK ":"$ ";
const compact = n => {
  const v=toNum(n),a=Math.abs(v);
  const f=(x,d)=>x.toFixed(d).replace(".",",").replace(/,0$/,"");
  if(a>=1e6)return f(v/1e6,a>=1e7?0:1)+"M";
  if(a>=1e5)return f(v/1e3,0)+"K";
  if(a>=1e4)return f(v/1e3,1)+"K";
  return new Intl.NumberFormat("es-AR",{maximumFractionDigits:0}).format(v);
};
const heroMoney=(n,c)=>{const v=toNum(n);if(Math.abs(v)>=1e5)return sym(c)+compact(v);return new Intl.NumberFormat("es-AR",{style:"currency",currency:c||"ARS",maximumFractionDigits:0}).format(v)};
const heroCost=(n,c)=>{if(n==null)return"\u2014";const v=toNum(n),a=Math.abs(v);if(a>=1e5)return sym(c)+compact(v);if(a>=1e3)return new Intl.NumberFormat("es-AR",{style:"currency",currency:c||"ARS",maximumFractionDigits:0}).format(v);return new Intl.NumberFormat("es-AR",{style:"currency",currency:c||"ARS",maximumFractionDigits:2}).format(v)};
const heroNum=n=>toNum(n)>=1e4?compact(n):new Intl.NumberFormat("es-AR").format(toNum(n));
const pct=n=>n==null||n===""?"\u2014":`${toNum(n).toFixed(2)}%`;
const ago=ts=>{if(!ts)return"";const s=Math.round((Date.now()-ts)/1000);if(s<60)return"reci\u00e9n";if(s<3600)return`hace ${Math.round(s/60)} min`;return`hace ${Math.round(s/3600)} h`};

/* React helpers */
const {createElement:h,useState,useEffect,useMemo,useCallback,useRef}=React;
const L=window.lucide||{};
const icon=(name,size,color)=>{if(!L[name])return null;return h(L[name],{size:size||16,color,strokeWidth:2})};

/* API */
async function apiFetch(path,opts={}){
  const url=CONFIG.serverUrl.replace(/\/$/,"")+path;
  const res=await fetch(url,{...opts,headers:{"Content-Type":"application/json","x-panel-secret":CONFIG.secret,...(opts.headers||{})}});
  const data=await res.json().catch(()=>({error:`HTTP ${res.status}`}));
  if(!res.ok)throw new Error(data.error||`Error ${res.status}`);
  return data;
}

/* Semana ISO actual */
const currentWeek=(()=>{const d=new Date();const jan1=new Date(d.getFullYear(),0,1);const wk=Math.ceil(((d-jan1)/864e5+jan1.getDay()+1)/7);return`${d.getFullYear()}-W${String(wk).padStart(2,"0")}`})();

function exportPDF(account,data,alerts,range,monthlyData,goals,w){
    var cur=data.currency||account.cur;
    var acc=data.account||{};
    var phrase=range.key==="d7"?"\u00daltimos 7 d\u00edas":range.key==="d30"?"\u00daltimos 30 d\u00edas":range.from+" al "+range.to;
    var today=new Date().toLocaleDateString("es-AR",{day:"numeric",month:"short",year:"numeric"});
    var camps=(data.campaigns||[]).filter(function(c){return toNum(c.spend)>0});
    var maxConv=Math.max.apply(null,(monthlyData||[]).map(function(d){return d.conversations||0}).concat([1]));
    var allGoalVals=Object.values(goals||{}).filter(function(v){return v}).map(Number);
    var maxH=Math.max(maxConv,Math.max.apply(null,allGoalVals.concat([1])));

    var chartBars=(monthlyData||[]).map(function(d){
      var mIdx=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"].indexOf(d.label);
      var mk=d.year+"-"+String(mIdx+1).padStart(2,"0");
      var g=(goals||{})[mk];
      var barH=Math.round((d.conversations/maxH)*100);
      var goalH=g?Math.round((g/maxH)*100):0;
      var diff=g?d.conversations-g:null;
      var diffColor=diff!==null?(diff>=0?"#2D7A4F":"#D85A30"):"";
      var diffBg=diff!==null?(diff>=0?"#E8F5E9":"#FEE9E1"):"";
      return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end">'
        +'<div style="position:relative;width:100%">'
        +(g?'<div style="width:100%;height:'+goalH+'px;border:1.5px solid #ddd;border-radius:4px 4px 0 0;position:absolute;bottom:0;background:#fafafa"></div>':'')
        +'<div style="width:100%;height:'+Math.max(barH,18)+'px;background:#F2740B;border-radius:4px 4px 0 0;position:relative;z-index:1;display:flex;align-items:flex-start;justify-content:center;padding-top:3px"><span style="font-size:9px;color:#fff;font-weight:700">'+d.conversations+'</span></div>'
        +'</div>'
        +(diff!==null?'<div style="background:'+diffBg+';border-radius:4px;padding:2px 5px;margin-top:4px"><div style="font-size:8.5px;color:'+diffColor+';font-weight:700">'+(diff>=0?"+":"")+diff+'</div></div>':'')
        +'<div style="font-size:10px;color:#999;margin-top:'+(diff!==null?'3':'8')+'px">'+d.label+'</div>'
        +'</div>';
    }).join("");

    var campRows=camps.map(function(c){
      var ctrColor=toNum(c.ctr)>=1?"#2D7A4F":"#1a1a1a";
      return '<tr style="border-bottom:0.5px solid #F0F0F0">'
        +'<td style="padding:8px;font-weight:500">'+c.name+'</td>'
        +'<td style="padding:8px;text-align:right;color:#D85A30;font-weight:600">'+heroMoney(c.spend,cur)+'</td>'
        +'<td style="padding:8px;text-align:right">'+heroNum(c.conversations)+'</td>'
        +'<td style="padding:8px;text-align:right">'+heroCost(c.cost_per_msg,cur)+'</td>'
        +'<td style="padding:8px;text-align:right;color:'+ctrColor+'">'+pct(c.ctr)+'</td>'
        +'</tr>';
    }).join("");

    var alertRows=(alerts||[]).map(function(a){
      var icon=a.sev==="green"?"\u2714":"\u26a0";
      var color=a.sev==="green"?"#2D7A4F":a.sev==="red"?"#D85A30":"#BA7517";
      return '<div style="display:flex;gap:6px;margin-bottom:4px"><span style="color:'+color+'">'+icon+'</span> '+a.text+'</div>';
    }).join("");

    var trendCPM=data.prev_cost_per_msg?Math.round((toNum(acc.cost_per_msg)-data.prev_cost_per_msg)/data.prev_cost_per_msg*100):null;
    var trendTxt=trendCPM!==null?'<div style="font-size:10px;color:'+(trendCPM>0?"#D85A30":"#2D7A4F")+';margin-top:2px">'+(trendCPM>0?"+":"")+trendCPM+'% vs. anterior</div>':"";

    var doc='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Reporte '+account.name+'</title>'
      +'<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;color:#1a1a1a;padding:16px 18px;font-size:11px}@media print{body{padding:12px}@page{margin:6mm;size:A4}}.no-break{page-break-inside:avoid}</style></head><body>'
      +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid #F2740B">'
      +'<div><div style="font-size:11px;color:#F2740B;font-weight:700;letter-spacing:1px;text-transform:uppercase">Reporte de performance</div>'
      +'<div style="font-size:18px;font-weight:700;margin-top:2px">'+account.name+'</div>'
      +'<div style="font-size:12px;color:#888;margin-top:2px">'+phrase+' \u00b7 '+today+'</div></div>'
      +'<img src="'+CONFIG.serverUrl.replace(/\/$/,"")+'/logo.png" style="width:44px;height:44px;border-radius:10px" crossorigin></div>'

      +'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px">'
      +'<div style="background:#FFF7F0;border-radius:6px;padding:8px 10px"><div style="font-size:10px;color:#B86A20;font-weight:600;text-transform:uppercase;letter-spacing:0.5px">Gasto total</div><div style="font-size:17px;font-weight:700;color:#D85A30;margin-top:3px">'+heroMoney(acc.spend,cur)+'</div></div>'
      +'<div style="background:#F5F5F5;border-radius:6px;padding:8px 10px"><div style="font-size:10px;color:#666;font-weight:600;text-transform:uppercase;letter-spacing:0.5px">Conversaciones</div><div style="font-size:17px;font-weight:700;margin-top:3px">'+heroNum(acc.conversations)+'</div></div>'
      +'<div style="background:#F5F5F5;border-radius:6px;padding:8px 10px"><div style="font-size:10px;color:#666;font-weight:600;text-transform:uppercase;letter-spacing:0.5px">Costo por mensaje</div><div style="font-size:17px;font-weight:700;margin-top:3px">'+heroCost(acc.cost_per_msg,cur)+'</div>'+trendTxt+'</div>'
      +'<div style="background:#F5F5F5;border-radius:6px;padding:8px 10px"><div style="font-size:10px;color:#666;font-weight:600;text-transform:uppercase;letter-spacing:0.5px">Alcance</div><div style="font-size:17px;font-weight:700;margin-top:3px">'+heroNum(acc.reach)+'</div></div>'
      +'<div style="background:#F5F5F5;border-radius:6px;padding:8px 10px"><div style="font-size:10px;color:#666;font-weight:600;text-transform:uppercase;letter-spacing:0.5px">Impresiones</div><div style="font-size:17px;font-weight:700;margin-top:3px">'+heroNum(acc.impressions)+'</div></div>'
      +'<div style="background:#F0FAF4;border-radius:6px;padding:8px 10px"><div style="font-size:10px;color:#2D7A4F;font-weight:600;text-transform:uppercase;letter-spacing:0.5px">CTR</div><div style="font-size:17px;font-weight:700;color:#2D7A4F;margin-top:3px">'+pct(acc.ctr)+'</div></div>'
      +'</div>'

      +'<div style="margin-bottom:14px"><div style="font-size:11px;font-weight:700;color:#F2740B;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:8px">Campa\u00f1as</div>'
      +'<table style="width:100%;border-collapse:collapse;font-size:12px"><thead><tr style="border-bottom:1.5px solid #E5E5E5">'
      +'<th style="text-align:left;padding:6px 8px;font-size:10px;color:#999;font-weight:600;text-transform:uppercase">Campa\u00f1a</th>'
      +'<th style="text-align:right;padding:6px 8px;font-size:10px;color:#999;font-weight:600">Gasto</th>'
      +'<th style="text-align:right;padding:6px 8px;font-size:10px;color:#999;font-weight:600">Conv.</th>'
      +'<th style="text-align:right;padding:6px 8px;font-size:10px;color:#999;font-weight:600">C/msj</th>'
      +'<th style="text-align:right;padding:6px 8px;font-size:10px;color:#999;font-weight:600">CTR</th>'
      +'</tr></thead><tbody>'+campRows+'</tbody></table></div>'

      +(alertRows?'<div style="margin-bottom:12px;background:#FFFBF5;padding:10px 12px;border-left:3px solid #F2740B">'
      +'<div style="font-size:10px;font-weight:700;color:#F2740B;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:8px">Alertas</div>'
      +'<div style="font-size:12px;line-height:1.6">'+alertRows+'</div></div>':'')

      +(monthlyData&&monthlyData.length?'<div style="background:#F8F8F8;border-radius:8px;padding:14px 16px;margin-bottom:20px">'
      +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px"><div style="font-size:10px;font-weight:700;color:#F2740B;text-transform:uppercase;letter-spacing:0.8px">Rendimiento mensual</div>'
      +'<div style="margin-left:auto;display:flex;gap:14px;font-size:10px;color:#999">'
      +'<span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;background:#F2740B;border-radius:2px;display:inline-block"></span> Real</span>'
      +'<span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border:1.5px solid #ccc;border-radius:2px;display:inline-block;background:transparent"></span> Objetivo</span>'
      +'</div></div>'
      +'<div style="display:flex;align-items:flex-end;gap:4px;padding:0 2px;height:150px">'+chartBars+'</div></div>':'')

      +'<div style="border-top:0.5px solid #E5E5E5;padding-top:8px;display:flex;justify-content:space-between;font-size:9px;color:#bbb">'
      +'<div>Generado por Concepto Agencia</div><div>'+today+'</div></div>'
      +'</body></html>';

    w.document.open();w.document.write(doc);w.document.close();setTimeout(function(){w.print()},500);
  }

/* ================================================================ */
/* LOGIN                                                             */
/* ================================================================ */
function Login({onLogin}){
  const[server,setServer]=useState(CONFIG.serverUrl||"https://");
  const[secret,setSecret]=useState("");
  const[err,setErr]=useState("");
  const[loading,setLoading]=useState(false);
  const submit=async()=>{
    setErr("");setLoading(true);
    const url=server.replace(/\/$/,"");
    try{
      const res=await fetch(url+"/api/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({secret})});
      const d=await res.json();if(!d.ok)throw new Error("Clave incorrecta");
      CONFIG.serverUrl=url;CONFIG.secret=secret;
      localStorage.setItem("cc_server",url);localStorage.setItem("cc_secret",secret);
      onLogin();
    }catch(e){setErr(e.message||"No se pudo conectar")}
    setLoading(false);
  };
  const inp=(val,set,type,ph)=>h("input",{type:type||"text",value:val,onChange:e=>set(e.target.value),placeholder:ph,style:{width:"100%",background:D.card,border:`1px solid ${D.line}`,borderRadius:10,color:D.text,fontSize:14,padding:"12px 14px",outline:"none",fontFamily:"inherit"}});
  return h("div",{style:{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:D.bg,padding:20}},
    h("div",{style:{width:"100%",maxWidth:420}},
      h("div",{style:{display:"flex",alignItems:"center",gap:12,marginBottom:32}},
        h("img",{src:"/logo.png",style:{width:44,height:44,borderRadius:12,objectFit:"cover"}}),
        h("div",null,h("div",{style:{fontSize:20,fontWeight:800,color:D.text}},"Meta Ads \u00b7 Command Center"),h("div",{style:{fontSize:12,color:D.faint}},"Concepto Agencia"))),
      h("div",{style:{display:"flex",flexDirection:"column",gap:14}},
        h("div",null,h("label",{style:{fontSize:11,fontWeight:700,color:D.dim,textTransform:"uppercase",letterSpacing:.4,display:"block",marginBottom:6}},"URL del servidor"),inp(server,setServer,"text","https://tu-app.railway.app")),
        h("div",null,h("label",{style:{fontSize:11,fontWeight:700,color:D.dim,textTransform:"uppercase",letterSpacing:.4,display:"block",marginBottom:6}},"Clave de acceso"),inp(secret,setSecret,"password","Tu PANEL_SECRET")),
        err&&h("div",{style:{background:D.redSoft,border:`1px solid ${D.red}44`,borderRadius:10,padding:"10px 14px",fontSize:13,color:D.text}},err),
        h("button",{onClick:submit,disabled:loading||!server||!secret,style:{background:loading?D.line:D.orange,color:"#fff",border:"none",borderRadius:10,padding:"13px",fontSize:14,fontWeight:700,cursor:"pointer",opacity:(!server||!secret)?.5:1}},loading?"Conectando\u2026":"Conectar al panel"))));
}

/* ================================================================ */
/* STAT CARD                                                         */
/* ================================================================ */
function Stat({iconName,label,value,tint,trend}){
  return h("div",{style:{background:D.card,border:`1px solid ${D.line}`,borderRadius:14,padding:"13px 14px",minWidth:0}},
    h("div",{style:{display:"flex",alignItems:"center",gap:7,color:D.dim}},icon(iconName,13),h("span",{style:{fontSize:10.5,letterSpacing:.5,textTransform:"uppercase",fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},label)),
    h("div",{style:{fontSize:22,fontWeight:800,color:tint||D.text,marginTop:8,lineHeight:1.05,whiteSpace:"nowrap",overflow:"hidden"}},value),
    trend&&h("div",{style:{marginTop:5,display:"flex",alignItems:"center",gap:4,fontSize:11,color:trend.color,fontWeight:600}},icon(trend.dir==="up"?"TrendingUp":trend.dir==="down"?"TrendingDown":null,12,trend.color),trend.text));
}

/* ================================================================ */
/* METRIC GRID (para campañas/anuncios)                              */
/* ================================================================ */
function MetricGrid({items}){
  return h("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(84px,1fr))",gap:10}},
    ...items.map(function(x){return h("div",{key:x[0],style:{minWidth:0}},h("div",{style:{fontSize:9.5,color:D.faint,textTransform:"uppercase",letterSpacing:.3,fontWeight:600}},x[0]),h("div",{style:{fontSize:13.5,fontWeight:700,color:x[2]||D.text,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",marginTop:2}},x[1]))}));
}

/* ================================================================ */
/* CREATIVE ROW (con thumbnail)                                      */
/* ================================================================ */
function CreativeRow({ad,cur}){
  const active=/activ/i.test(ad.status||"");
  return h("div",{style:{background:D.card,border:`1px solid ${D.lineSoft}`,borderRadius:12,overflow:"hidden"}},
    h("div",{style:{display:"flex",gap:0}},
      ad.thumbnail_url
        ?h("div",{style:{width:80,flexShrink:0,background:D.lineSoft,position:"relative"}},h("img",{src:ad.thumbnail_url,style:{width:"100%",height:"100%",objectFit:"cover",display:"block"},onError:function(e){e.target.style.display="none"}}))
        :h("div",{style:{width:80,flexShrink:0,background:D.lineSoft,display:"flex",alignItems:"center",justifyContent:"center"}},icon("Image",22,D.faint)),
      h("div",{style:{flex:1,padding:"12px 14px",minWidth:0}},
        h("div",{style:{display:"flex",alignItems:"flex-start",gap:6,marginBottom:10}},
          h("span",{style:{fontSize:13,fontWeight:700,color:D.text,overflow:"hidden",textOverflow:"ellipsis",flex:1,lineHeight:1.3}},ad.name||"Anuncio sin nombre"),
          h("div",{style:{display:"flex",gap:4,flexShrink:0}},
            ad.format&&h("span",{style:{fontSize:9,fontWeight:700,color:D.dim,background:D.lineSoft,padding:"2px 6px",borderRadius:4,textTransform:"uppercase"}},ad.format),
            h("span",{style:{fontSize:9,fontWeight:700,color:active?D.green:D.faint,background:active?D.greenSoft:D.lineSoft,padding:"2px 6px",borderRadius:4}},active?"ON":"OFF"))),
        h(MetricGrid,{items:[["Gasto",heroMoney(ad.spend,cur),D.orange],["Conv.",heroNum(ad.conversations)],["C/msj",heroCost(ad.cost_per_msg,cur)],["Alcance",heroNum(ad.reach)],["Impr.",heroNum(ad.impressions)],["CTR",pct(ad.ctr),toNum(ad.ctr)>=1?D.green:null]]}))));
}

/* ================================================================ */
/* AUDIENCE SECTION                                                  */
/* ================================================================ */
function AudienceSection({campaignId,range}){
  const[st,setSt]=useState("idle");
  const[data,setData]=useState(null);
  const[err,setErr]=useState(null);
  const load=async()=>{
    setSt("loading");setErr(null);
    try{
      const p=new URLSearchParams({range:range.key});
      if(range.key==="custom"){p.set("from",range.from);p.set("to",range.to)}
      const d=await apiFetch(`/api/campaign/${campaignId}/audience?${p}`);
      setData(d);setSt("done");
    }catch(e){setErr(e.message);setSt("error")}
  };
  const PINK="#C13584",BLUE="#4267B2",PURPLE="#8B5CF6",TEAL="#0EA5E9";
  const platColor=function(p){if(/instagram/i.test(p))return PINK;if(/facebook/i.test(p))return BLUE;if(/audience/i.test(p))return PURPLE;return TEAL};
  const genColor=function(l){return/mujer/i.test(l)?PINK:/hombre/i.test(l)?BLUE:D.dim};

  if(st==="idle")return h("div",{style:{marginTop:12}},h("button",{onClick:load,style:{display:"inline-flex",alignItems:"center",gap:7,background:D.lineSoft,border:`1px solid ${D.line}`,color:D.dim,borderRadius:8,padding:"8px 14px",fontSize:12,fontWeight:700,cursor:"pointer"}},icon("PieChart",13,D.dim),"Ver audiencia"));
